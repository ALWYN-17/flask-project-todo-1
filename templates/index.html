{% extends 'base.html' %}
{% block head %}
    <title>Task Manager</title>
{% endblock %}

{% block body %}
    <div class="main"> 
        <h1>Task manager</h1>
        <table>
            <tr>
                <th>Task</th>
                <th>Added</th>
                <th>Action</th>
            </tr>

            {% for t in tasks %}
            <tr>
                <td>{{t.content}}</td>
                <td>{{t.date_created.date()}}</td>
                <td>
                    <a href="">Delete</a><br>
                    <a href="">Update</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <form action="/" method="POST">
        <input type="text" name="content" id="content">
        <input type="submit" value="Add Task">

    </form>
{% endblock %}
