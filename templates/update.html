{% extends 'base.html' %}
{% block head %}
    <title>Task Manager</title>
    <link rel="stylesheet" href="static\update.css">
    <style>
        .main{
            border: 5px rgb(12, 6, 6) solid;
            border-radius: 50px;
            box-shadow: 15px 10px black;
            width: 40%;
            margin-left: 30%;
            margin-top: 4%;
            margin: 150px auto;
            font-size: x-large;
            font-weight: bolder;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease-in-out;
        }
.main:hover{
            transform: scale(1.2);
        }
        input{
            width: 300px;
            height: 40px;
            border: 3px rgb(211, 206, 206) solid;
            border-radius: 20px;
            color: rgb(15, 15, 15);
            font-weight: bolder;
            margin-left: 25%;
            margin-bottom: 1%;
        }
        
        
        td{
            padding-bottom: 20px;
            padding-left: 20px;
        }
        label{
            color: aliceblue;
            font-weight: bolder;
            
        }
    #submit{
        color: #000;
        background-color: rgb(52, 67, 224);
        margin-left: 40%;
        width: 150px;
        height: 40px;
    }
    #content{
        width: 300px;
        height: 40px;
    }
    body{
            background-image: url(https://wallpapercave.com/wp/wp8997298.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }  
    </style>
{% endblock %}

{% block body %}
    <div class="main"> 

    <form action="/update/{{task.id}}" method="POST">
        <input type="text" name="content" id="content" placeholder="enter task" value="{{task.content}}">
        <input type="submit" value="UPDATE">

    </form>

{% endblock %}
